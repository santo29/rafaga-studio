name: "💡 Idea / Feature request"
description: Suggest something new · Propón algo nuevo
labels: ["idea"]
body:
  - type: textarea
    id: problema
    attributes:
      label: What do you want to make? · ¿Qué quieres lograr?
      description: Describe the content or the job you want the studio to do for you.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: How could it work? · ¿Cómo podría funcionar?
  - type: textarea
    id: ejemplos
    attributes:
      label: Examples or references · Ejemplos o referencias
      description: Links or screenshots of tools that already do something similar.
